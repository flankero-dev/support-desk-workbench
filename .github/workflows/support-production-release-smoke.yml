name: Support Desk production post-release smoke
on:
  push:
    branches:
      - audit/support-production-smoke-20261113
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check deployed GitHub Pages with synthetic isolated-browser data
        run: node tests/production-release-smoke.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: support-production-postrelease-evidence
          path: artifacts/support-production-smoke/
          if-no-files-found: warn
          retention-days: 30
